services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://store:store@db:5432/store?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
